<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Portfolio Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔐</text></svg>">
</head>
<body class="admin-body">

<button id="sidebar-toggle" class="sidebar-toggle" aria-label="Menu"><span></span><span></span><span></span></button>

<aside id="sidebar">
  <div class="sidebar-brand">Kabirul <span>Hasnat</span> Pranta<small>Admin</small></div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <span id="user-email"></span>
    <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
    <a href="https://hasnatpranta.github.io/" target="_blank" rel="noopener" class="view-site-link">View live site ↗</a>
  </div>
</aside>

<main id="content"></main>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/app.js"></script>
<script>
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('content').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
  });
</script>
</body>
</html>
